<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BLACK VEIN</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
    
    <style>
        * { 
            touch-action: manipulation; 
            user-select: none; 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: "Geist Pixel", sans-serif;
        }
        
        body { 
            text-align: center; 
            background: #090d16; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            color: #fff; 
            padding: 20px; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
        }

        /* Canvas สำหรับเอฟเฟกต์ Mouse/Touch Trail */
        #trail-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes strokeGlow {
            0% { border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 0 10px rgba(255, 255, 255, 0.05); }
            50% { border-color: rgba(255, 255, 255, 0.6); box-shadow: 0 0 20px rgba(255, 255, 255, 0.25); }
            100% { border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 0 10px rgba(255, 255, 255, 0.05); }
        }

        .header-container { 
            width: 100%; 
            max-width: 400px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 5px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            animation: strokeGlow 4s infinite ease-in-out, fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 1;
        }

        h2 {
            font-size: 1.8rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status { margin-top: 6px; font-size: 14px; color: #fbbf24; font-weight: bold; }

        button.start-btn { 
            font-size: 16px; 
            padding: 12px 24px; 
            border-radius: 5px; 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            color: white; 
            border: none; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 12px; 
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        button.start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
        }

        /* --- ปุ่มทรงกากบาท (D-Pad Cross Layout) --- */
        .controls-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 8px;
            justify-content: center;
            align-items: center;
            animation: fadeInUp 0.8s ease forwards;
        }

        .action-btn {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            color: white;
            font-size: 26px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.2s ease;
            backdrop-filter: blur(8px);
            transform: scale(1.2);
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .action-btn:active {
            transform: scale(1);
            filter: brightness(1.4);
        }

        /* กำหนดตำแหน่งรูปบวก และสไตล์แต่ละปุ่ม */
        .btn-y {
            grid-column: 2;
            grid-row: 1;
            background: radial-gradient(circle, #eab308 0%, #ca8a04 100%);
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
        }

        .btn-x {
            grid-column: 1;
            grid-row: 2;
            background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-b {
            grid-column: 3;
            grid-row: 2;
            background: radial-gradient(circle, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-a {
            grid-column: 2;
            grid-row: 3;
            background: radial-gradient(circle, #22c55e 0%, #15803d 100%);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .center-decor {
            grid-column: 2;
            grid-row: 2;
            width: 24px;
            height: 24px;
            margin: auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="trail-canvas"></canvas>
    <br>
    <div class="header-container">
        <h2>BLACK VEIN</h2>
        <div id="status" class="status">Disconnect</div>
        <button id="startBtn" class="start-btn" onclick="initController()">Connect</button>
    </div>

    <!-- ปรับ Event มือถือ (ontouchstart/ontouchend) และคอม (onmousedown/onmouseup) ให้ส่งสถานะ DOWN / UP -->
    <div class="controls-wrapper">
        <div class="dpad-container">
            <button class="action-btn btn-y" 
                    ontouchstart="sendButtonState('Y', 'DOWN')" ontouchend="sendButtonState('Y', 'UP')"
                    onmousedown="sendButtonState('Y', 'DOWN')" onmouseup="sendButtonState('Y', 'UP')">Y</button>
            <button class="action-btn btn-x" 
                    ontouchstart="sendButtonState('X', 'DOWN')" ontouchend="sendButtonState('X', 'UP')"
                    onmousedown="sendButtonState('X', 'DOWN')" onmouseup="sendButtonState('X', 'UP')">X</button>
            <div class="center-decor"></div>
            <button class="action-btn btn-b" 
                    ontouchstart="sendButtonState('B', 'DOWN')" ontouchend="sendButtonState('B', 'UP')"
                    onmousedown="sendButtonState('B', 'DOWN')" onmouseup="sendButtonState('B', 'UP')">B</button>
            <button class="action-btn btn-a" 
                    ontouchstart="sendButtonState('A', 'DOWN')" ontouchend="sendButtonState('A', 'UP')"
                    onmousedown="sendButtonState('A', 'DOWN')" onmouseup="sendButtonState('A', 'UP')">A</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('gameId');

        let peer;
        let conn;

        let gyroX = 0, gyroY = 0, gyroZ = 0;
        let isButtonPressed = 0;

        function initController() {
            if (!hostId) {
                alert("ไม่พบรหัสห้อง (gameId)! กรุณาสแกน QR Code จากหน้าจอเกมใหม่อีกครั้ง");
                return;
            }

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') startPeer();
                    else alert("ต้องกดอนุญาตใช้งาน Motion Sensor ก่อนเล่นนะครับ");
                }).catch(console.error);
            } else {
                startPeer();
            }
        }

        function startPeer() {
            document.getElementById("status").innerText = "Searching console ID: " + hostId;
            peer = new Peer();

            peer.on('open', (id) => {
                conn = peer.connect(hostId);

                conn.on('open', () => {
                    document.getElementById("status").innerText = "Connected!";
                    document.getElementById("status").style.color = "#22c55e";
                    document.getElementById("startBtn").style.display = "none";
                    
                    setupMotionSensor();
                    startSendingData();
                });

                conn.on('data', (data) => {
                    if (data === 'vibrate') {
                        if ('vibrate' in navigator) {
                            navigator.vibrate(100);
                        }
                    }
                });

                conn.on('error', (err) => {
                    document.getElementById("status").innerText = "🔴 เชื่อมต่อไม่สำเร็จ: " + err;
                });
            });

            peer.on('error', (err) => {
                document.getElementById("status").innerText = "🔴 เกิดข้อผิดพลาด: " + err.type;
            });
        }

        function setupMotionSensor() {
            window.addEventListener('devicemotion', (event) => {
                gyroX = event.rotationRate ? event.rotationRate.beta || 0 : 0;
                gyroY = event.rotationRate ? event.rotationRate.gamma || 0 : 0;
                gyroZ = event.rotationRate ? event.rotationRate.alpha || 0 : 0;
            });
        }

        // ปรับปรุงฟังก์ชันส่งสัญญาณให้แยก DOWN และ UP
        function sendButtonState(btnName, state) {
            if (state === 'DOWN' && 'vibrate' in navigator) {
                navigator.vibrate(40);
            }

            if (conn && conn.open) {
                conn.send(`ACTION_${btnName}_${state}`);
            }
        }

        function startSendingData() {
            setInterval(() => {
                if (!conn || !conn.open) return;

                let dataString = `${gyroX.toFixed(2)},${gyroY.toFixed(2)},${gyroZ.toFixed(2)},${isButtonPressed},0`;
                conn.send(dataString);
            }, 16); 
        }
    </script>

    <script>
        const canvas = document.getElementById("trail-canvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
                this.color = `hsl(${Math.random() * 60 + 190}, 100%, 70%)`;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticles(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(x, y));
            }
        }

        window.addEventListener("mousemove", createParticles);
        window.addEventListener("touchmove", createParticles);

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>

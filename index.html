<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tennis & Sword Controller</title>
    <!-- โหลด PeerJS และ NippleJS (สำหรับ Joystick) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        * { touch-action: manipulation; user-select: none; }
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: #fff; padding: 20px; margin: 0; overflow: hidden; }
        button { font-size: 18px; padding: 14px 28px; border-radius: 12px; background: #0284c7; color: white; border: none; font-weight: bold; width: 100%; margin-top: 10px; }
        .status { margin-top: 10px; font-size: 15px; color: #fbbf24; font-weight: bold; }
        
        /* โซนสำหรับวาง Joystick บนหน้าจอ */
        #joystickZone {
            width: 100%;
            height: 250px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed #334155;
            border-radius: 16px;
            position: relative;
        }
    </style>
</head>
<body>
    <h2>🎾 Tennis & Sword Controller</h2>
    <div id="status" class="status">🔴 ยังไม่ได้กดเชื่อมต่อ</div>
    <button id="startBtn" onclick="initController()">1. อนุญาตเซนเซอร์ & เชื่อมต่อ</button>

    <!-- โซนจอยสติ๊ก -->
    <div id="joystickZone"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('gameId');

        let peer;
        let conn;

        // ค่า Gyro และ Joystick ปัจจุบัน
        let gyroX = 0, gyroY = 0, gyroZ = 0;
        let moveX = 0, moveY = 0;

        function initController() {
            if (!hostId) {
                alert("ไม่พบรหัสห้อง (gameId)! กรุณาสแกน QR Code จากหน้าจอเกมใหม่อีกครั้ง");
                return;
            }

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') startPeer();
                    else alert("ต้องกดอนุญาตใช้งาน Motion Sensor ก่อนเล่นนะครับ");
                }).catch(console.error);
            } else {
                startPeer();
            }
        }

        function startPeer() {
            document.getElementById("status").innerText = "🟡 กำลังค้นหาเครื่องเกม ID: " + hostId;
            peer = new Peer();

            peer.on('open', (id) => {
                conn = peer.connect(hostId);

                conn.on('open', () => {
                    document.getElementById("status").innerText = "🟢 เชื่อมต่อสำเร็จ! ใช้ Joystick เดินและเหวี่ยงมือถือได้เลย";
                    document.getElementById("status").style.color = "#4ade80";
                    document.getElementById("startBtn").style.display = "none"; // ซ่อนปุ่มเมื่อต่อติด
                    
                    setupJoystick();
                    startSendingData();
                });

                conn.on('error', (err) => {
                    document.getElementById("status").innerText = "🔴 เชื่อมต่อไม่สำเร็จ: " + err;
                });
            });

            peer.on('error', (err) => {
                document.getElementById("status").innerText = "🔴 เกิดข้อผิดพลาด: " + err.type;
            });
        }

        // สร้าง Virtual Joystick
        function setupJoystick() {
            const options = {
                zone: document.getElementById('joystickZone'),
                mode: 'static',
                position: { left: '50%', top: '50%' },
                color: '#0284c7',
                size: 130
            };
            
            const manager = nipplejs.create(options);

            manager.on('move', (evt, data) => {
                if (data && data.vector) {
                    // ส่งค่าเป็น -1.0 ถึง 1.0 (X = ซ้าย/ขวา, Y = บน/ล่าง)
                    moveX = data.vector.x;
                    moveY = data.vector.y;
                }
            });

            manager.on('end', () => {
                // ปล่อยมือแล้วคืนค่าเป็น 0
                moveX = 0;
                moveY = 0;
            });

            // ดักจับ Motion Sensors
            window.addEventListener('devicemotion', (event) => {
                gyroX = event.rotationRate ? event.rotationRate.beta || 0 : 0;
                gyroY = event.rotationRate ? event.rotationRate.gamma || 0 : 0;
                gyroZ = event.rotationRate ? event.rotationRate.alpha || 0 : 0;
            });
        }

        // ส่งข้อมูลทั้ง Gyro และ Joystick เข้า Unity พร้อมกันทุกๆ Frame (60 FPS / ~16ms)
        function startSendingData() {
            setInterval(() => {
                if (!conn || !conn.open) return;

                // Format: GyroX, GyroY, GyroZ, JoyX, JoyY
                let dataString = `${gyroX.toFixed(2)},${gyroY.toFixed(2)},${gyroZ.toFixed(2)},${moveX.toFixed(2)},${moveY.toFixed(2)}`;
                conn.send(dataString);
            }, 16); 
        }
    </script>
</body>
</html>
